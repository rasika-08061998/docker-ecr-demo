name: Terraform ECR Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::528757804354:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Apply (single-step, guaranteed)
        run: |
          echo "=== WHERE AM I ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== TERRAFORM DIRECTORY ==="
          ls -la terraform-ecr

          echo "=== ENTER TERRAFORM DIRECTORY ==="
          cd terraform-ecr

          echo "=== TERRAFORM FILES ==="
          ls -la

          terraform init
          terraform apply -auto-approve
          terraform output
